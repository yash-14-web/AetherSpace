<!-- Create Folder Modal -->
<div x-show="newFolderModalOpen" 
     x-cloak
     class="fixed inset-0 z-50 overflow-y-auto"
     aria-labelledby="folder-modal-title" 
     role="dialog" 
     aria-modal="true">
    
    <div x-show="newFolderModalOpen"
         x-transition:enter="ease-out duration-200"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="ease-in duration-150"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="fixed inset-0 bg-slate-900/60 dark:bg-black/80 backdrop-blur-sm transition-opacity"
         @click="newFolderModalOpen = false"></div>

    <div class="flex min-h-full items-center justify-center p-4 text-center">
        <div x-show="newFolderModalOpen"
             x-transition:enter="ease-out duration-200"
             x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
             x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
             x-transition:leave="ease-in duration-150"
             x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
             x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
             class="relative transform overflow-hidden rounded-2xl bg-white dark:bg-[#121824] border border-slate-200 dark:border-zinc-800 text-left shadow-2xl transition-all w-full max-w-md p-6 space-y-5">

            <!-- Modal Header -->
            <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-zinc-800/80">
                <div class="flex items-center space-x-2.5">
                    <div class="w-8 h-8 rounded-lg bg-amber-500/10 text-amber-600 dark:text-amber-400 flex items-center justify-center">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/>
                        </svg>
                    </div>
                    <div>
                        <h3 class="text-base font-bold text-slate-900 dark:text-zinc-100" id="folder-modal-title">New Folder</h3>
                        <p class="text-xs text-slate-500 dark:text-zinc-400">Organize files inside <span class="font-medium text-slate-700 dark:text-zinc-300">{{ workspace.name }}</span></p>
                    </div>
                </div>
                <button type="button" @click="newFolderModalOpen = false" class="text-slate-400 hover:text-slate-600 dark:hover:text-zinc-200">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <form method="POST" action="{% url 'files:folder_create' slug=workspace.slug %}" class="space-y-4">
                {% csrf_token %}
                {% if folder %}
                <input type="hidden" name="parent" value="{{ folder.id }}">
                {% endif %}

                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-zinc-300 mb-1.5">Folder Name *</label>
                    <input type="text" 
                           name="name" 
                           required 
                           autofocus
                           placeholder="e.g. Design Assets, Sprint 02, Meeting Notes"
                           class="w-full px-3.5 py-2 text-xs rounded-xl border border-slate-200 dark:border-zinc-700 bg-slate-50 dark:bg-zinc-800/60 text-slate-900 dark:text-zinc-100 focus:outline-none focus:ring-2 focus:ring-aether-blue/30 focus:border-aether-blue">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-zinc-300 mb-1.5">Color Accent</label>
                    <select name="color" class="w-full px-3.5 py-2 text-xs rounded-xl border border-slate-200 dark:border-zinc-700 bg-slate-50 dark:bg-zinc-800/60 text-slate-900 dark:text-zinc-100 focus:outline-none focus:ring-2 focus:ring-aether-blue/30 focus:border-aether-blue">
                        <option value="amber">Amber Yellow (Default)</option>
                        <option value="blue">Sapphire Blue</option>
                        <option value="purple">Violet Purple</option>
                        <option value="emerald">Emerald Green</option>
                        <option value="rose">Rose Red</option>
                        <option value="cyan">Cyan Teal</option>
                    </select>
                </div>

                <div class="flex items-center justify-end space-x-2.5 pt-2">
                    <button type="button" @click="newFolderModalOpen = false" class="px-3.5 py-2 text-xs font-medium rounded-xl border border-slate-200 dark:border-zinc-700 text-slate-700 dark:text-zinc-300 hover:bg-slate-50 dark:hover:bg-zinc-800 transition-colors">
                        Cancel
                    </button>
                    <button type="submit" class="px-4 py-2 text-xs font-semibold rounded-xl bg-aether-blue hover:bg-blue-600 text-white shadow-sm transition-all">
                        Create Folder
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
