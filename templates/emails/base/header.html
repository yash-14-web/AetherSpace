<!-- AetherSpace Email Header Component -->
<table border="0" cellpadding="0" cellspacing="0" width="100%" role="presentation" class="email-header" style="margin-bottom: 24px; border-bottom: 1px solid #e2e8f0; padding-bottom: 16px;">
  <tr>
    <td align="left" valign="middle">
      <table border="0" cellpadding="0" cellspacing="0" role="presentation">
        <tr>
          <td valign="middle" style="padding-right: 12px;">
            <a href="{% if site_url %}{{ site_url }}{% else %}/{% endif %}" target="_blank" style="text-decoration: none; display: inline-block;">
              <img src="{% if site_url %}{{ site_url }}{% endif %}/static/images/logo.png" alt="AetherSpace Logo" width="36" height="36" style="display: block; width: 36px; height: 36px; border: 0; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic;">
            </a>
          </td>
          <td valign="middle">
            <a href="{% if site_url %}{{ site_url }}{% else %}/{% endif %}" target="_blank" style="text-decoration: none; display: inline-block;">
              <span style="font-size: 20px; font-weight: 800; color: #2563eb; letter-spacing: -0.02em; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; line-height: 1.1; vertical-align: middle;">AetherSpace</span>
            </a>
            <div style="font-size: 11px; font-weight: 500; color: #64748b; margin-top: 3px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; letter-spacing: 0.02em; line-height: 1.2;">
              High-Performance Agile Team Platform
            </div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
