<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{ subject|default:"AetherSpace Notification" }}</title>
  <style type="text/css">
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
    body { margin: 0; padding: 0; width: 100% !important; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #0f172a; line-height: 1.6; }
    
    .email-container { width: 100%; max-width: 600px; margin: 0 auto; }
    .email-card { background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 32px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
    
    h1 { font-size: 20px; font-weight: 700; color: #0f172a; margin: 0 0 16px 0; letter-spacing: -0.02em; line-height: 1.3; }
    h2 { font-size: 16px; font-weight: 600; color: #0f172a; margin: 0 0 12px 0; }
    p { font-size: 14px; color: #334155; margin: 0 0 16px 0; line-height: 1.6; }
    
    .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 16px; }
    .badge-blue { background-color: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
    .badge-emerald { background-color: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
    .badge-amber { background-color: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
    .badge-rose { background-color: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .badge-indigo { background-color: #eef2ff; color: #4f46e5; border: 1px solid #c7d2fe; }
    .badge-purple { background-color: #faf5ff; color: #9333ea; border: 1px solid #e9d5ff; }
    
    .btn { display: inline-block; padding: 12px 24px; background-color: #2563eb; color: #ffffff !important; border-radius: 8px; font-weight: 600; font-size: 14px; text-decoration: none; text-align: center; }
    
    .metadata-card { background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; margin: 20px 0; }
    .metadata-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; padding: 10px 16px; width: 35%; border-bottom: 1px solid #e2e8f0; }
    .metadata-value { font-size: 13px; font-weight: 600; color: #0f172a; padding: 10px 16px; width: 65%; border-bottom: 1px solid #e2e8f0; }
    
    .quote-box { background-color: #f8fafc; border-left: 3px solid #2563eb; border-radius: 0 8px 8px 0; padding: 14px 16px; margin: 16px 0; color: #334155; font-size: 13px; font-style: italic; }
    
    @media (prefers-color-scheme: dark) {
      body { background-color: #09090b !important; color: #f4f4f5 !important; }
      .email-bg { background-color: #09090b !important; }
      .email-card { background-color: #18181b !important; border-color: #27272a !important; box-shadow: 0 10px 25px rgba(0,0,0,0.5) !important; }
      h1, h2 { color: #f4f4f5 !important; }
      p { color: #a1a1aa !important; }
      .email-header, .email-footer { border-color: #27272a !important; }
      .badge-blue { background-color: rgba(37,99,235,0.15) !important; color: #60a5fa !important; border-color: rgba(37,99,235,0.3) !important; }
      .badge-emerald { background-color: rgba(16,185,129,0.15) !important; color: #34d399 !important; border-color: rgba(16,185,129,0.3) !important; }
      .badge-amber { background-color: rgba(245,158,11,0.15) !important; color: #fbbf24 !important; border-color: rgba(245,158,11,0.3) !important; }
      .badge-rose { background-color: rgba(220,38,38,0.15) !important; color: #f87171 !important; border-color: rgba(220,38,38,0.3) !important; }
      .badge-indigo { background-color: rgba(99,102,241,0.15) !important; color: #818cf8; border-color: rgba(99,102,241,0.3) !important; }
      .badge-purple { background-color: rgba(147,51,234,0.15) !important; color: #c084fc !important; border-color: rgba(147,51,234,0.3) !important; }
      .metadata-card { background-color: #09090b !important; border-color: #27272a !important; }
      .metadata-label { color: #a1a1aa !important; border-color: #27272a !important; }
      .metadata-value { color: #f4f4f5 !important; border-color: #27272a !important; }
      .quote-box { background-color: #09090b !important; color: #d4d4d8 !important; border-left-color: #3b82f6 !important; }
    }
    
    @media only screen and (max-width: 600px) {
      .email-card { padding: 20px 16px !important; border-radius: 0 !important; border-left: none !important; border-right: none !important; }
      .metadata-label, .metadata-value { display: block !important; width: 100% !important; padding: 6px 12px !important; }
      .metadata-label { border-bottom: none !important; padding-bottom: 2px !important; }
      .btn { display: block !important; width: 100% !important; box-sizing: border-box !important; }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <table border="0" cellpadding="0" cellspacing="0" width="100%" class="email-bg" role="presentation" style="background-color: #f8fafc;">
    <tr>
      <td align="center" class="email-bg" style="padding: 32px 12px; background-color: #f8fafc;">
        <table border="0" cellpadding="0" cellspacing="0" width="100%" class="email-container" style="max-width: 600px;" role="presentation">
          <tr>
            <td class="email-card" style="background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 32px;">
              {% include 'emails/base/header.html' %}
              {% block email_content %}{% endblock %}
              {% include 'emails/base/footer.html' %}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
