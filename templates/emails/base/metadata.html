<!-- AetherSpace Metadata Card Component -->
<table border="0" cellpadding="0" cellspacing="0" width="100%" role="presentation" class="metadata-card" style="margin: 20px 0; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; border-collapse: separate; overflow: hidden;">
  {% if meta_title %}
    <tr>
      <td colspan="2" style="padding: 12px 16px 8px 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; color: #0f172a; border-bottom: 1px solid #e2e8f0;">
        {{ meta_title }}
      </td>
    </tr>
  {% endif %}
  {% block metadata_rows %}
  {% endblock %}
</table>
