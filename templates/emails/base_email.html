<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <style>
        body { margin: 0; padding: 0; background-color: #09090b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #f4f4f5; }
        .wrapper { width: 100%; max-width: 600px; margin: 0 auto; padding: 32px 16px; }
        .card { background-color: #18181b; border: 1px solid #27272a; border-radius: 16px; padding: 32px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .header { display: flex; align-items: center; margin-bottom: 24px; }
        .brand { font-size: 20px; font-weight: 900; color: #3b82f6; text-decoration: none; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 16px; }
        .badge-blue { background-color: rgba(37,99,235,0.15); color: #60a5fa; border: 1px solid rgba(37,99,235,0.3); }
        .badge-emerald { background-color: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
        .badge-amber { background-color: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
        h1 { font-size: 22px; font-weight: 800; margin: 0 0 16px 0; color: #ffffff; letter-spacing: -0.02em; }
        p { font-size: 14px; line-height: 1.6; color: #a1a1aa; margin: 0 0 16px 0; }
        .btn { display: inline-block; padding: 12px 24px; background-color: #2563eb; color: #ffffff !important; border-radius: 10px; font-weight: 700; font-size: 14px; text-decoration: none; text-align: center; margin-top: 16px; }
        .footer { margin-top: 24px; text-align: center; font-size: 12px; color: #71717a; }
        .footer a { color: #3b82f6; text-decoration: none; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card">
            <div class="header">
                <a href="{{ site_url|default:'http://127.0.0.1:8000' }}" class="brand">⚡ AetherSpace</a>
            </div>
            {% block email_content %}{% endblock %}
        </div>
        <div class="footer">
            <p>© {{ year }} AetherSpace. High-Performance Agile Team Platform.</p>
            <p>You received this email according to your <a href="{{ site_url|default:'http://127.0.0.1:8000' }}/settings/notifications/">notification settings</a>.</p>
        </div>
    </div>
</body>
</html>
