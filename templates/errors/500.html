{% extends 'base.html' %}

{% block title %}500 — Internal Server Error{% endblock %}

{% block sidebar %}{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full aether-card p-8 text-center space-y-6 shadow-xl">
        <div class="inline-flex px-3 py-1 rounded-full text-xs font-bold bg-rose-50 dark:bg-rose-950/50 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-900/50">
            Error 500
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-zinc-50">
            Internal Server Error
        </h1>
        <p class="text-xs text-slate-500 dark:text-zinc-400 leading-relaxed">
            Something went wrong on our end. Our engineering team has been notified.
        </p>
        <div class="pt-4 border-t border-slate-100 dark:border-zinc-800 flex items-center justify-center gap-3">
            <button onclick="window.location.reload()" class="aether-button-secondary text-xs py-2 px-4">
                Reload Page
            </button>
            <a href="{% url 'core:landing' %}" class="aether-button-primary text-xs py-2 px-4">
                Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
