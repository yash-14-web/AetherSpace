{% if user.is_authenticated %}
<!-- AetherSpace Meet Hub M1 — Global Incoming & Outgoing Call Manager with Web Audio Synthesizer -->
<div x-data="globalCallManager()"
     x-cloak
     class="select-none pointer-events-none">

    <!-- 1. INCOMING CALL OVERLAY MODAL -->
    <div x-show="showIncomingModal" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-[-24px] scale-95"
         x-transition:enter-end="opacity-100 translate-y-0 scale-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-y-0 scale-100"
         x-transition:leave-end="opacity-0 translate-y-[-24px] scale-95"
         class="fixed top-6 right-6 z-[100] max-w-sm sm:max-w-md w-full bg-slate-900/95 dark:bg-[#18181b]/95 backdrop-blur-md text-white rounded-3xl p-5 shadow-2xl border-2 border-blue-500/60 ring-4 ring-blue-500/20 pointer-events-auto">
        
        <div class="flex items-start space-x-4">
            <!-- Animated Caller Avatar with Radar Pulse -->
            <div class="relative shrink-0">
                <template x-if="incomingData.caller_avatar && !incomingData.caller_avatar.startsWith('preset:')">
                    <img :src="incomingData.caller_avatar" :alt="incomingData.caller_name" class="w-14 h-14 rounded-2xl object-cover ring-2 ring-blue-400">
                </template>
                <template x-if="!incomingData.caller_avatar || incomingData.caller_avatar.startsWith('preset:')">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-purple-600 flex items-center justify-center text-white font-bold text-xl shadow-lg ring-2 ring-blue-400/50">
                        <span x-text="getInitials(incomingData.caller_name)"></span>
                    </div>
                </template>
                <!-- Pulsing live ringing indicator -->
                <span class="absolute -bottom-1 -right-1 flex h-4 w-4">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-4 w-4 bg-emerald-500 ring-2 ring-slate-900"></span>
                </span>
            </div>

            <!-- Call & Caller Details -->
            <div class="flex-1 min-w-0">
                <div class="flex items-center flex-wrap gap-1.5">
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-bold tracking-wider uppercase bg-blue-500/20 text-blue-300 border border-blue-500/30 flex items-center space-x-1">
                        <svg x-show="incomingData.is_audio_only" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                        </svg>
                        <svg x-show="!incomingData.is_audio_only" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                        </svg>
                        <span x-text="incomingData.is_audio_only ? 'Audio Call' : 'Video Call'"></span>
                    </span>

                    <template x-if="incomingData.caller_contributor_id">
                        <span class="px-1.5 py-0.5 rounded text-[10px] font-mono font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30"
                              x-text="incomingData.caller_contributor_id"></span>
                    </template>

                    <span class="text-xs text-blue-400 animate-pulse font-medium">Incoming...</span>
                </div>

                <h4 class="text-base font-bold text-white truncate mt-1" x-text="incomingData.caller_name || 'Team Member'"></h4>
                <p class="text-xs text-zinc-300 truncate font-medium" x-text="incomingData.workspace_name ? ('Workspace: ' + incomingData.workspace_name) : 'AetherSpace Meet Hub'"></p>

                <!-- Status warnings: DND or Autoplay audio unlock pill -->
                <div class="flex items-center gap-2 mt-1.5">
                    <template x-if="isDND">
                        <span class="inline-flex items-center gap-1 text-[11px] text-amber-400 font-medium">
                            <span>🌙</span>
                            <span>Do Not Disturb (Silent)</span>
                        </span>
                    </template>
                    <template x-if="audioBlocked && !isDND">
                        <button type="button" 
                                @click="unlockAudioContext()"
                                class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-semibold bg-blue-500/30 hover:bg-blue-500/40 text-blue-300 border border-blue-400/40 transition">
                            <span>🔊</span>
                            <span>Tap to enable sound</span>
                        </button>
                    </template>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center justify-end space-x-3 mt-4 pt-3 border-t border-zinc-800">
            <button type="button"
                    @click="declineIncomingCall()" 
                    class="px-4 py-2 rounded-xl text-xs font-semibold text-zinc-300 hover:text-white bg-zinc-800 hover:bg-zinc-700 transition">
                Decline
            </button>
            <button type="button"
                    @click="acceptIncomingCall()" 
                    class="px-5 py-2 rounded-xl text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-500 transition shadow-lg flex items-center space-x-2">
                <svg class="w-4 h-4 animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                </svg>
                <span>Accept &amp; Join</span>
            </button>
        </div>
    </div>

    <!-- 2. OUTGOING CALL OVERLAY MODAL (Caller's Waiting Screen) -->
    <div x-show="showOutgoingModal" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-[-24px] scale-95"
         x-transition:enter-end="opacity-100 translate-y-0 scale-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-y-0 scale-100"
         x-transition:leave-end="opacity-0 translate-y-[-24px] scale-95"
         class="fixed top-6 right-6 z-[100] max-w-sm sm:max-w-md w-full bg-slate-900/95 dark:bg-[#18181b]/95 backdrop-blur-md text-white rounded-3xl p-5 shadow-2xl border-2 border-indigo-500/60 ring-4 ring-indigo-500/20 pointer-events-auto">
        
        <div class="flex items-start space-x-4">
            <!-- Recipient Avatar with Breathing Outgoing Pulse -->
            <div class="relative shrink-0">
                <template x-if="outgoingData.recipient_avatar && !outgoingData.recipient_avatar.startsWith('preset:')">
                    <img :src="outgoingData.recipient_avatar" :alt="outgoingData.recipient_name" class="w-14 h-14 rounded-2xl object-cover ring-2 ring-indigo-400">
                </template>
                <template x-if="!outgoingData.recipient_avatar || outgoingData.recipient_avatar.startsWith('preset:')">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 to-sky-600 flex items-center justify-center text-white font-bold text-xl shadow-lg ring-2 ring-indigo-400/50">
                        <span x-text="getInitials(outgoingData.recipient_name)"></span>
                    </div>
                </template>
                <span class="absolute -bottom-1 -right-1 flex h-4 w-4">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-sky-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-4 w-4 bg-sky-500 ring-2 ring-slate-900"></span>
                </span>
            </div>

            <!-- Outgoing Information -->
            <div class="flex-1 min-w-0">
                <div class="flex items-center space-x-2">
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-bold tracking-wider uppercase bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                        <span x-text="outgoingData.is_audio_only ? 'Audio Call' : 'Video Call'"></span>
                    </span>
                    <span class="text-xs text-zinc-400 font-medium" :class="outgoingData.error ? 'text-amber-400 font-semibold' : 'animate-pulse'" x-text="outgoingData.error ? 'Call Notice' : 'Calling...'">Calling...</span>
                </div>
                <h4 class="text-base font-bold text-white truncate mt-1" x-text="outgoingData.recipient_name || 'Team Member'"></h4>
                <div class="flex items-center gap-2 mt-0.5">
                    <span class="text-xs" :class="outgoingData.error ? 'text-amber-400 font-medium' : 'text-zinc-300'" x-text="outgoingData.error || 'Ringing...'">Ringing...</span>
                    <template x-if="outgoingData.recipient_contributor_id">
                        <span class="px-1.5 py-0.2 rounded text-[10px] font-mono font-semibold bg-zinc-800 text-zinc-400 border border-zinc-700"
                              x-text="outgoingData.recipient_contributor_id"></span>
                    </template>
                </div>
            </div>
        </div>

        <!-- Action: Cancel Call -->
        <div class="flex items-center justify-end space-x-3 mt-4 pt-3 border-t border-zinc-800">
            <button type="button"
                    @click="cancelOutgoingCall()" 
                    class="px-5 py-2 rounded-xl text-xs font-semibold text-rose-200 hover:text-white bg-rose-950/80 hover:bg-rose-900 border border-rose-800/80 transition flex items-center space-x-1.5">
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
                <span>Cancel Call</span>
            </button>
        </div>
    </div>

    <!-- 3. TOAST STATUS NOTIFICATION (e.g. Call Declined / Busy / Cancelled / Error) -->
    <div x-show="toastMessage"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 translate-y-[-10px]"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 translate-y-[-10px]"
         class="fixed top-6 right-6 z-[110] max-w-sm px-4 py-3 rounded-2xl bg-zinc-900/95 text-white border border-zinc-700/80 shadow-2xl flex items-center space-x-2.5 pointer-events-auto">
        <span class="text-base" x-text="toastIcon"></span>
        <span class="text-xs font-medium text-zinc-200 truncate flex-1" x-text="toastMessage"></span>
        <button type="button" @click="toastMessage = ''" class="text-zinc-400 hover:text-white text-xs">✕</button>
    </div>
</div>

<script>
function globalCallManager() {
    return {
        // State
        ws: null,
        wsConnected: false,
        reconnectAttempts: 0,
        maxReconnectAttempts: 5,

        showIncomingModal: false,
        incomingData: {},

        showOutgoingModal: false,
        outgoingData: {},

        toastMessage: '',
        toastIcon: '📞',
        toastTimeout: null,

        // Audio synthesizer state
        audioCtx: null,
        ringtoneInterval: null,
        ringbackInterval: null,
        callTimeoutTimer: null,
        audioBlocked: false,

        get isDND() {
            return this.incomingData && this.incomingData.recipient_status === 'dnd';
        },

        init() {
            // 1. Establish global persistent WebSocket on ws/calls/global/
            console.log('[CALL-DIAG] globalCallManager init() starting...');
            this.initWebSocket();

            // 2. Window event listeners for app-wide call initiation (from Chat DM, hover card, Meet Hub)
            window.addEventListener('aetherspace:initiate_call', (e) => {
                console.log('[CALL-DIAG] aetherspace:initiate_call event received', e.detail);
                if (e.detail) {
                    this.initiateCall(e.detail);
                }
            });

            // 3. Window event listener for chat-broadcast fallback
            window.addEventListener('aetherspace:incoming_call', (e) => {
                console.log('[CALL-DIAG] aetherspace:incoming_call fallback event received', e.detail);
                if (e.detail && !this.showIncomingModal) {
                    this.handleIncomingCall(e.detail);
                }
            });

            // 4. Pre-emptively prepare AudioContext on first user interaction
            const unlockHandler = () => {
                this.unlockAudioContext();
                window.removeEventListener('click', unlockHandler);
                window.removeEventListener('keydown', unlockHandler);
                window.removeEventListener('touchstart', unlockHandler);
            };
            window.addEventListener('click', unlockHandler, { once: true });
            window.addEventListener('keydown', unlockHandler, { once: true });
            window.addEventListener('touchstart', unlockHandler, { once: true });

            // 5. Request browser desktop notification permission if supported
            if ('Notification' in window && Notification.permission === 'default') {
                setTimeout(() => {
                    Notification.requestPermission().catch(() => {});
                }, 4000);
            }
        },

        getInitials(name) {
            if (!name) return 'U';
            const parts = name.trim().split(/\s+/);
            if (parts.length >= 2) {
                return (parts[0][0] + parts[1][0]).toUpperCase();
            }
            return name.substring(0, 2).toUpperCase();
        },

        showToast(msg, icon = '📞', duration = 4000) {
            this.toastMessage = msg;
            this.toastIcon = icon;
            if (this.toastTimeout) clearTimeout(this.toastTimeout);
            this.toastTimeout = setTimeout(() => {
                this.toastMessage = '';
            }, duration);
        },

        // ----------------------------------------------------------------------
        // Audio Synthesizer (Standard Dual-Tone Telephone Ring: 440 Hz + 480 Hz)
        // ----------------------------------------------------------------------

        getAudioContext() {
            if (!this.audioCtx) {
                const AudioClass = window.AudioContext || window.webkitAudioContext;
                if (AudioClass) {
                    this.audioCtx = new AudioClass();
                }
            }
            if (this.audioCtx && this.audioCtx.state === 'suspended') {
                this.audioCtx.resume().catch(() => {
                    this.audioBlocked = true;
                });
            }
            return this.audioCtx;
        },

        unlockAudioContext() {
            try {
                const ctx = this.getAudioContext();
                if (ctx && ctx.state === 'suspended') {
                    ctx.resume().then(() => {
                        this.audioBlocked = false;
                        if (this.showIncomingModal && !this.isDND && !this.ringtoneInterval) {
                            this.startRingtone();
                        }
                    });
                }
            } catch (e) {
                console.warn("Audio unlock notice:", e);
            }
        },

        startRingtone() {
            // DND status suppresses audible ringtone
            if (this.isDND) {
                return;
            }

            try {
                const ctx = this.getAudioContext();
                if (!ctx) return;

                if (ctx.state === 'suspended') {
                    this.audioBlocked = true;
                    return;
                }
                this.audioBlocked = false;

                const playBurst = () => {
                    if (!this.showIncomingModal || !this.audioCtx) return;
                    const now = this.audioCtx.currentTime;

                    const osc1 = this.audioCtx.createOscillator();
                    const osc2 = this.audioCtx.createOscillator();
                    const gain = this.audioCtx.createGain();

                    osc1.type = 'sine';
                    osc1.frequency.setValueAtTime(440, now);
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(480, now);

                    // 1.8s ring with smooth ramp attack and decay
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.18, now + 0.08);
                    gain.gain.setValueAtTime(0.18, now + 1.72);
                    gain.gain.linearRampToValueAtTime(0, now + 1.8);

                    osc1.connect(gain);
                    osc2.connect(gain);
                    gain.connect(this.audioCtx.destination);

                    osc1.start(now);
                    osc2.start(now);
                    osc1.stop(now + 1.8);
                    osc2.stop(now + 1.8);
                };

                playBurst();
                if (this.ringtoneInterval) clearInterval(this.ringtoneInterval);
                this.ringtoneInterval = setInterval(playBurst, 3500);

            } catch (err) {
                console.warn("Ringtone synthesizer failed:", err);
            }
        },

        stopRingtone() {
            if (this.ringtoneInterval) {
                clearInterval(this.ringtoneInterval);
                this.ringtoneInterval = null;
            }
            if (this.callTimeoutTimer) {
                clearTimeout(this.callTimeoutTimer);
                this.callTimeoutTimer = null;
            }
        },

        startRingback() {
            // Subtle ringback tone for caller: gentle 440 Hz pulse
            try {
                const ctx = this.getAudioContext();
                if (!ctx || ctx.state === 'suspended') return;

                const playPulse = () => {
                    if (!this.showOutgoingModal || !this.audioCtx) return;
                    const now = this.audioCtx.currentTime;
                    const osc = this.audioCtx.createOscillator();
                    const gain = this.audioCtx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);

                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.04, now + 0.05);
                    gain.gain.setValueAtTime(0.04, now + 1.2);
                    gain.gain.linearRampToValueAtTime(0, now + 1.3);

                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);

                    osc.start(now);
                    osc.stop(now + 1.3);
                };

                playPulse();
                if (this.ringbackInterval) clearInterval(this.ringbackInterval);
                this.ringbackInterval = setInterval(playPulse, 3200);

            } catch (e) {
                console.warn("Ringback sound notice:", e);
            }
        },

        stopRingback() {
            if (this.ringbackInterval) {
                clearInterval(this.ringbackInterval);
                this.ringbackInterval = null;
            }
        },

        // ----------------------------------------------------------------------
        // Global WebSocket Connection (ws/calls/global/)
        // ----------------------------------------------------------------------

        initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/calls/global/`;
            console.log('[CALL-DIAG] initWebSocket: connecting to', wsUrl);

            try {
                this.ws = new WebSocket(wsUrl);

                this.ws.onopen = () => {
                    this.wsConnected = true;
                    this.reconnectAttempts = 0;
                    console.log('[CALL-DIAG] WebSocket CONNECTED to', wsUrl);
                    if (this.presenceHeartbeatTimer) clearInterval(this.presenceHeartbeatTimer);
                    this.presenceHeartbeatTimer = setInterval(() => {
                        if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                            this.sendWs({ action: 'heartbeat' });
                        }
                    }, 60000);
                };

                this.ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        console.log('[CALL-DIAG] WebSocket MESSAGE received:', data.type, data);
                        this.handleWsMessage(data);
                    } catch (err) {
                        console.error('[CALL-DIAG] Error parsing call WebSocket payload:', err, event.data);
                    }
                };

                this.ws.onerror = (err) => {
                    console.warn('[CALL-DIAG] WebSocket ERROR:', err);
                };

                this.ws.onclose = (event) => {
                    this.wsConnected = false;
                    if (this.presenceHeartbeatTimer) {
                        clearInterval(this.presenceHeartbeatTimer);
                        this.presenceHeartbeatTimer = null;
                    }
                    console.log('[CALL-DIAG] WebSocket CLOSED code=', event.code, 'reason=', event.reason);
                    if (event.code !== 1000 && event.code !== 4001 && this.reconnectAttempts < this.maxReconnectAttempts) {
                        const backoff = Math.min(10000, 1000 * Math.pow(2, this.reconnectAttempts));
                        this.reconnectAttempts++;
                        console.log('[CALL-DIAG] WebSocket reconnecting in', backoff, 'ms (attempt', this.reconnectAttempts, ')');
                        setTimeout(() => {
                            this.initWebSocket();
                        }, backoff);
                    }
                };
            } catch (e) {
                console.error('[CALL-DIAG] Could not construct call WebSocket:', e);
            }
        },

        sendWs(payload) {
            if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                this.ws.send(JSON.stringify(payload));
                return true;
            }
            return false;
        },

        // ----------------------------------------------------------------------
        // Message Dispatcher
        // ----------------------------------------------------------------------

        handleWsMessage(data) {
            console.log('[CALL-DIAG] handleWsMessage dispatching type=', data.type);
            switch (data.type) {
                case 'call_incoming':
                    console.log('[CALL-DIAG] -> dispatching to handleIncomingCall');
                    this.handleIncomingCall(data);
                    break;

                case 'call_outgoing':
                    console.log('[CALL-DIAG] -> dispatching to handleOutgoingCall');
                    this.handleOutgoingCall(data);
                    break;

                case 'call_accepted':
                    console.log('[CALL-DIAG] -> dispatching to handleCallAccepted');
                    this.handleCallAccepted(data);
                    break;

                case 'call_declined':
                    this.handleCallDeclined(data);
                    break;

                case 'call_cancelled':
                    this.handleCallCancelled(data);
                    break;

                case 'call_missed':
                    this.handleCallMissed(data);
                    break;

                case 'presence_change':
                    console.log('[PRESENCE-DIAG] presence_change event received for user:', data.user_id, data.status);
                    window.dispatchEvent(new CustomEvent('aether:presence-change', { detail: data }));
                    break;

                case 'call_error':
                    console.warn('[CALL-DIAG] call_error received:', data.message);
                    this.stopRingback();
                    if (this.showOutgoingModal) {
                        this.outgoingData.error = data.message || 'Call error.';
                        this.showToast(data.message || 'Call error.', '⚠️');
                        setTimeout(() => {
                            this.showOutgoingModal = false;
                            this.outgoingData = {};
                        }, 3000);
                    } else {
                        this.showToast(data.message || 'Call error.', '⚠️');
                    }
                    break;
            }
        },

        // ----------------------------------------------------------------------
        // Call Event Handlers
        // ----------------------------------------------------------------------

        handleIncomingCall(data) {
            console.log('[CALL-DIAG] handleIncomingCall FIRED:', data.call_id, 'from', data.caller_name);
            // Dismiss outgoing modal if any
            this.showOutgoingModal = false;
            this.stopRingback();

            this.incomingData = data;
            this.showIncomingModal = true;
            console.log('[CALL-DIAG] showIncomingModal set to TRUE — modal should appear now');
            this.startRingtone();

            // Background Tab Desktop Notification
            if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
                const callKind = data.is_audio_only ? 'audio' : 'video';
                const notif = new Notification(`Incoming ${callKind} call from ${data.caller_name || 'Team Member'}`, {
                    body: `Calling you on AetherSpace (${data.workspace_name || 'Meet Hub'})`,
                    icon: (data.caller_avatar && !data.caller_avatar.startsWith('preset:')) ? data.caller_avatar : undefined,
                    tag: `call_${data.call_id}`,
                    requireInteraction: true
                });
                notif.onclick = () => {
                    window.focus();
                    notif.close();
                };
            }

            // 45-second auto-timeout if recipient does not interact
            if (this.callTimeoutTimer) clearTimeout(this.callTimeoutTimer);
            this.callTimeoutTimer = setTimeout(() => {
                this.handleTimeoutExpiry();
            }, 45000);
        },

        handleOutgoingCall(data) {
            // If already answered or room active, ignore
            if (this.showIncomingModal) return;

            this.outgoingData = data;
            this.showOutgoingModal = true;
            this.startRingback();

            // 45-second timeout for outgoing
            if (this.callTimeoutTimer) clearTimeout(this.callTimeoutTimer);
            this.callTimeoutTimer = setTimeout(() => {
                this.handleTimeoutExpiry();
            }, 45000);
        },

        handleCallAccepted(data) {
            console.log('[CALL-DIAG] handleCallAccepted FIRED:', data);
            this.stopRingtone();
            this.stopRingback();
            this.showIncomingModal = false;
            this.showOutgoingModal = false;

            if (data.room_url) {
                console.log('[CALL-DIAG] NAVIGATING to room_url:', data.room_url);
                window.location.href = data.room_url;
            } else {
                console.warn('[CALL-DIAG] call_accepted received but no room_url!');
            }
        },

        handleCallDeclined(data) {
            this.stopRingtone();
            this.stopRingback();
            this.showIncomingModal = false;
            this.showOutgoingModal = false;

            const name = data.declined_by_name || 'User';
            this.showToast(`${name} declined the call.`, '🚫');
        },

        handleCallCancelled(data) {
            this.stopRingtone();
            this.stopRingback();
            this.showIncomingModal = false;
            this.showOutgoingModal = false;

            this.showToast('Call cancelled by caller.', 'ℹ️');
        },

        handleCallMissed(data) {
            this.stopRingtone();
            this.stopRingback();
            this.showIncomingModal = false;
            this.showOutgoingModal = false;

            this.showToast('Missed call.', '📞');
        },

        handleTimeoutExpiry() {
            const callId = (this.incomingData && this.incomingData.call_id) || (this.outgoingData && this.outgoingData.call_id);
            if (callId) {
                // Inform server to transition to MISSED
                this.sendWs({
                    action: 'timeout',
                    call_id: callId
                });
            }
            this.stopRingtone();
            this.stopRingback();
            this.showIncomingModal = false;
            this.showOutgoingModal = false;
            this.showToast('No answer. Call ended.', '⏱️');
        },

        // ----------------------------------------------------------------------
        // User Actions (Accept, Decline, Cancel, Initiate)
        // ----------------------------------------------------------------------

        acceptIncomingCall() {
            this.stopRingtone();
            const callId = this.incomingData.call_id;
            const roomUrl = this.incomingData.room_url;
            console.log('[CALL-DIAG] acceptIncomingCall: call_id=', callId, 'room_url=', roomUrl);

            // Send accept action via WebSocket
            const sent = this.sendWs({
                action: 'accept',
                call_id: callId
            });
            console.log('[CALL-DIAG] acceptIncomingCall: WebSocket send result=', sent);

            // HTTP Fallback if WebSocket was disconnected
            if (!sent && this.incomingData.workspace_slug) {
                console.log('[CALL-DIAG] acceptIncomingCall: using HTTP fallback');
                const csrf = document.querySelector('[name=csrfmiddlewaretoken]')?.value || '';
                fetch(`/meetings/w/${this.incomingData.workspace_slug}/api/calls/${callId}/accept/`, {
                    method: 'POST',
                    headers: { 'X-CSRFToken': csrf, 'Content-Type': 'application/json' }
                }).then(r => r.json()).then(res => {
                    console.log('[CALL-DIAG] HTTP accept response:', res);
                    if (res.room_url) window.location.href = res.room_url;
                }).catch((err) => {
                    console.error('[CALL-DIAG] HTTP accept failed:', err);
                });
            }

            this.showIncomingModal = false;

            // FIX: Do NOT navigate immediately.
            // Let the server broadcast call_accepted which triggers handleCallAccepted -> navigation.
            // But if WebSocket send failed and HTTP fallback also isn't used, navigate directly as last resort.
            if (!sent && !this.incomingData.workspace_slug && roomUrl) {
                console.log('[CALL-DIAG] acceptIncomingCall: LAST RESORT direct navigation to', roomUrl);
                window.location.href = roomUrl;
            } else {
                console.log('[CALL-DIAG] acceptIncomingCall: waiting for call_accepted event from server to navigate');
            }
        },

        declineIncomingCall() {
            this.stopRingtone();
            const callId = this.incomingData.call_id;

            const sent = this.sendWs({
                action: 'decline',
                call_id: callId,
                reason: 'declined'
            });

            if (!sent && this.incomingData.workspace_slug) {
                const csrf = document.querySelector('[name=csrfmiddlewaretoken]')?.value || '';
                fetch(`/meetings/w/${this.incomingData.workspace_slug}/api/calls/${callId}/decline/`, {
                    method: 'POST',
                    headers: { 'X-CSRFToken': csrf, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reason: 'declined' })
                }).catch(() => {});
            }

            this.showIncomingModal = false;
            this.incomingData = {};
        },

        cancelOutgoingCall() {
            this.stopRingback();
            const callId = this.outgoingData.call_id;

            const sent = this.sendWs({
                action: 'cancel',
                call_id: callId
            });

            if (!sent && this.outgoingData.workspace_slug) {
                const csrf = document.querySelector('[name=csrfmiddlewaretoken]')?.value || '';
                fetch(`/meetings/w/${this.outgoingData.workspace_slug}/api/calls/${callId}/cancel/`, {
                    method: 'POST',
                    headers: { 'X-CSRFToken': csrf, 'Content-Type': 'application/json' }
                }).catch(() => {});
            }

            this.showOutgoingModal = false;
            this.outgoingData = {};
        },

        initiateCall(detail) {
            // detail: { recipient_id, call_mode, workspace_slug, conversation_id }
            if (!detail || !detail.recipient_id || !detail.workspace_slug) {
                console.warn("Invalid initiateCall parameters:", detail);
                return;
            }

            // Unlock audio on initiation click
            this.unlockAudioContext();

            // Set optimistic outgoing state
            this.outgoingData = {
                recipient_id: detail.recipient_id,
                recipient_name: detail.recipient_name || 'Team Member',
                recipient_avatar: detail.recipient_avatar || '',
                recipient_contributor_id: detail.recipient_contributor_id || '',
                call_mode: detail.call_mode || 'VIDEO',
                is_audio_only: (detail.call_mode === 'AUDIO'),
                workspace_slug: detail.workspace_slug
            };
            this.showOutgoingModal = true;
            this.startRingback();

            const sent = this.sendWs({
                action: 'initiate',
                workspace_slug: detail.workspace_slug,
                recipient_id: detail.recipient_id,
                call_mode: detail.call_mode || 'VIDEO',
                conversation_id: detail.conversation_id || null
            });

            if (!sent) {
                // HTTP API Fallback
                const csrf = document.querySelector('[name=csrfmiddlewaretoken]')?.value || '';
                fetch(`/meetings/w/${detail.workspace_slug}/api/calls/initiate/`, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': csrf,
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        recipient_id: detail.recipient_id,
                        call_mode: detail.call_mode || 'VIDEO',
                        conversation_id: detail.conversation_id || null
                    })
                })
                .then(r => r.json())
                .then(res => {
                    if (res.success) {
                        this.outgoingData.call_id = res.call_id;
                        this.outgoingData.meeting_code = res.meeting_code;
                        this.outgoingData.room_url = res.room_url;
                    } else {
                        this.stopRingback();
                        this.showOutgoingModal = false;
                        this.showToast(res.error || 'Could not start call.', '⚠️');
                    }
                })
                .catch(err => {
                    this.stopRingback();
                    this.showOutgoingModal = false;
                    this.showToast('Call initiation failed.', '⚠️');
                });
            }
        }
    };
}
</script>
{% endif %}
