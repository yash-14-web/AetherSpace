<!-- Universal Global People Hover Card for Mentions & User Elements -->
<div x-data="universalUserHoverCard()"
     x-cloak
     @mouseover.window="handleMouseOver($event)"
     @mouseout.window="handleMouseOut($event)"
     @mousemove.window.passive="handleWindowMouseMove($event)"
     @scroll.window.passive="hideImmediate()"
     @click.window="handleClickOutside($event)"
     class="relative z-[9999]">

    <!-- Floating Popover Card -->
    <div x-ref="popoverCard"
         x-show="open"
         x-transition:enter="transition ease-out duration-150"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-100"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95"
         @mouseenter="cancelHide()"
         @mouseleave="hide()"
         :style="`position: fixed; top: ${cardTop}px; left: ${cardLeft}px; z-index: 99999;`"
         class="w-[350px] max-w-[calc(100vw-32px)] rounded-2xl bg-white dark:bg-[#0f172a] border border-slate-200 dark:border-zinc-800 shadow-2xl overflow-hidden pointer-events-auto select-none"
         style="display: none;">

        <!-- Decorative Gradient Top Accent Bar -->
        <div class="h-1.5 w-full bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600"></div>

        <div class="p-4 space-y-3">
            <!-- Loading State Spinner -->
            <template x-if="loading && !loaded">
                <div class="flex items-center justify-center py-6 space-x-2 text-slate-400">
                    <svg class="animate-spin h-5 w-5 text-blue-600" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                    </svg>
                    <span class="text-xs font-medium">Loading profile...</span>
                </div>
            </template>

            <!-- Profile Content -->
            <template x-if="loaded">
                <div>
                    <!-- 1. Header: Avatar + User Identity -->
                    <div class="flex items-center gap-3">
                        <div class="relative w-12 h-12 rounded-full ring-2 ring-blue-500/20 bg-slate-100 dark:bg-zinc-800 flex items-center justify-center shrink-0 overflow-hidden">
                            <template x-if="data.avatar && !data.avatar.startsWith('preset:')">
                                <img :src="data.avatar" alt="" class="w-full h-full object-cover rounded-full">
                            </template>
                            <template x-if="!data.avatar || data.avatar.startsWith('preset:')">
                                <div class="w-full h-full rounded-full bg-gradient-to-tr from-blue-600 to-indigo-700 text-white font-bold text-sm flex items-center justify-center">
                                    <span x-text="data.initials"></span>
                                </div>
                            </template>
                            <!-- Availability status indicator dot -->
                            <span class="absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full border-2 border-white dark:border-[#0f172a]"
                                  :class="{
                                      'bg-emerald-500': data.availability_status === 'available' || !data.availability_status,
                                      'bg-rose-500': data.availability_status === 'busy',
                                      'bg-red-600': data.availability_status === 'dnd',
                                      'bg-amber-400': data.availability_status === 'away',
                                      'bg-slate-400': data.availability_status === 'ooo',
                                      'bg-zinc-500': data.availability_status === 'offline'
                                  }"
                                  :title="data.availability_status ? data.availability_status.toUpperCase() : 'Available'">
                            </span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <h4 class="text-sm font-bold text-slate-900 dark:text-zinc-50 truncate" x-text="data.full_name"></h4>
                                <template x-if="data.is_owner">
                                    <span class="inline-flex items-center gap-0.5 px-1.5 py-0.2 rounded text-[10px] font-bold uppercase tracking-wider bg-amber-500/15 text-amber-600 dark:bg-amber-500/20 dark:text-amber-400 border border-amber-500/30">
                                        ★ OWNER
                                    </span>
                                </template>
                            </div>
                            <p class="text-xs text-slate-500 dark:text-zinc-400 truncate mt-0.5" x-text="data.email"></p>

                            <!-- Contributor ID & Availability Pills -->
                            <div class="flex items-center gap-2 mt-1.5">
                                <template x-if="data.contributor_id">
                                    <span class="inline-flex items-center gap-1 px-1.5 py-0.2 rounded text-[10px] font-mono font-bold bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-sky-400 border border-blue-200/80 dark:border-blue-900/60">
                                        <svg class="w-2.5 h-2.5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2" /></svg>
                                        <span x-text="data.contributor_id"></span>
                                    </span>
                                </template>

                                <span class="inline-flex items-center gap-1.5 px-2 py-0.2 rounded-full text-[10px] font-semibold border"
                                      :class="{
                                          'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-500/20': data.availability_status === 'available' || !data.availability_status,
                                          'bg-rose-500/10 text-rose-600 dark:text-rose-400 border-rose-500/20': data.availability_status === 'busy',
                                          'bg-red-600/10 text-red-600 dark:text-red-400 border-red-600/20': data.availability_status === 'dnd',
                                          'bg-amber-500/10 text-amber-600 dark:text-amber-400 border-amber-500/20': data.availability_status === 'away',
                                          'bg-slate-400/10 text-slate-600 dark:text-slate-400 border-slate-400/20': data.availability_status === 'ooo',
                                          'bg-zinc-500/10 text-zinc-500 dark:text-zinc-400 border-zinc-500/20': data.availability_status === 'offline'
                                      }">
                                    <span class="w-1.5 h-1.5 rounded-full"
                                          :class="{
                                              'bg-emerald-500': data.availability_status === 'available' || !data.availability_status,
                                              'bg-rose-500': data.availability_status === 'busy',
                                              'bg-red-600': data.availability_status === 'dnd',
                                              'bg-amber-400': data.availability_status === 'away',
                                              'bg-slate-400': data.availability_status === 'ooo',
                                              'bg-zinc-500': data.availability_status === 'offline'
                                          }"></span>
                                    <span x-text="data.availability_status ? (data.availability_status === 'dnd' ? 'Do Not Disturb' : (data.availability_status === 'ooo' ? 'Out of Office' : data.availability_status.charAt(0).toUpperCase() + data.availability_status.slice(1))) : 'Available'"></span>
                                </span>
                            </div>
                        </div>
                    </div>

                    <!-- 2. Workspace Memberships: One-Line Compact Rows (All Equal) -->
                    <div class="mt-2.5 pt-2.5 border-t border-slate-100 dark:border-zinc-800/80 space-y-1.5">
                        <template x-for="(m, idx) in (data.memberships && data.memberships.length ? (expandedWorkspaces ? data.memberships : data.memberships.slice(0, 3)) : [])" :key="idx">
                            <div class="flex items-center gap-1.5 text-xs truncate leading-tight py-0.5">
                                <!-- Briefcase Icon -->
                                <svg class="w-3.5 h-3.5 text-blue-500 dark:text-sky-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                                </svg>

                                <!-- Role Badge -->
                                <span class="px-1.5 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider shrink-0"
                                      :class="getRoleBadge(m).bg"
                                      x-text="getRoleBadge(m).text">
                                </span>

                                <!-- Middot separator if Job Title exists -->
                                <template x-if="getJobTitle(m)">
                                    <span class="text-slate-400 dark:text-zinc-500 font-bold shrink-0">&middot;</span>
                                </template>
                                <!-- Job Title -->
                                <template x-if="getJobTitle(m)">
                                    <span class="font-medium text-slate-700 dark:text-zinc-200 truncate shrink-0" x-text="getJobTitle(m)"></span>
                                </template>

                                <!-- Middot separator if Tagging Role exists -->
                                <template x-if="m.tagging_role">
                                    <span class="text-slate-400 dark:text-zinc-500 font-bold shrink-0">&middot;</span>
                                </template>
                                <!-- Tagging Department -->
                                <template x-if="m.tagging_role">
                                    <span class="font-semibold text-purple-600 dark:text-purple-400 shrink-0" x-text="m.tagging_role"></span>
                                </template>

                                <!-- Middot separator if Workspace Name exists -->
                                <template x-if="m.workspace_name">
                                    <span class="text-slate-400 dark:text-zinc-500 font-bold shrink-0">&middot;</span>
                                </template>
                                <!-- Workspace Name -->
                                <template x-if="m.workspace_name">
                                    <span class="font-medium text-slate-600 dark:text-zinc-300 truncate" :title="m.workspace_name" x-text="m.workspace_name"></span>
                                </template>
                            </div>
                        </template>

                        <!-- Zero memberships state -->
                        <template x-if="!data.memberships || data.memberships.length === 0">
                            <div class="flex items-center gap-1.5 text-xs text-slate-400 dark:text-zinc-500 py-1">
                                <svg class="w-3.5 h-3.5 text-slate-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                                </svg>
                                <span class="italic">No workspace memberships</span>
                            </div>
                        </template>

                        <!-- Expandable +N more button for >3 memberships -->
                        <template x-if="data.memberships && data.memberships.length > 3">
                            <div class="pt-0.5">
                                <template x-if="!expandedWorkspaces">
                                    <button type="button"
                                            @click.stop="expandedWorkspaces = true; adjustPosition()"
                                            class="inline-flex items-center gap-1.5 py-0.5 text-xs font-semibold text-blue-600 dark:text-sky-400 hover:text-blue-700 dark:hover:text-sky-300 transition cursor-pointer">
                                        <svg class="w-3.5 h-3.5 text-blue-500 dark:text-sky-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                                        </svg>
                                        <span class="px-1.5 py-0.2 rounded bg-blue-50 dark:bg-blue-950/60 border border-blue-200/80 dark:border-blue-900/60 text-[10px] font-bold" x-text="`+${data.memberships.length - 3} more`"></span>
                                    </button>
                                </template>
                                <template x-if="expandedWorkspaces">
                                    <button type="button"
                                            @click.stop="expandedWorkspaces = false; adjustPosition()"
                                            class="inline-flex items-center gap-1 text-[11px] font-medium text-slate-500 dark:text-zinc-400 hover:text-slate-700 dark:hover:text-zinc-200 transition cursor-pointer">
                                        <span>Show less</span>
                                        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
                                    </button>
                                </template>
                            </div>
                        </template>
                    </div>

                    <!-- 3. Footer: Equal-width Email and Profile Action Buttons -->
                    <div class="mt-3 pt-2.5 border-t border-slate-100 dark:border-zinc-800/80 grid grid-cols-2 gap-2">
                        <a :href="data.mailto_url"
                           class="inline-flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-zinc-800/80 hover:bg-slate-200 dark:hover:bg-zinc-700 text-slate-800 dark:text-zinc-200 border border-slate-200/80 dark:border-zinc-700/80 transition shadow-2xs">
                            <svg class="w-3.5 h-3.5 text-slate-500 dark:text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
                            <span>Email</span>
                        </a>
                        <a :href="data.profile_url"
                           class="inline-flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-zinc-800/80 hover:bg-slate-200 dark:hover:bg-zinc-700 text-slate-800 dark:text-zinc-200 border border-slate-200/80 dark:border-zinc-700/80 transition shadow-2xs">
                            <svg class="w-3.5 h-3.5 text-slate-500 dark:text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                            <span>Profile</span>
                        </a>
                    </div>
                </div>
            </template>

            <!-- Not Found State for Unregistered Persons -->
            <template x-if="notFound && !loading">
                <div class="p-1">
                    <div class="flex items-start space-x-3">
                        <div class="w-10 h-10 rounded-full bg-slate-100 dark:bg-zinc-800 text-slate-400 dark:text-zinc-500 flex items-center justify-center shrink-0 border border-slate-200 dark:border-zinc-700">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center space-x-1.5">
                                <h4 class="text-xs font-bold text-slate-900 dark:text-zinc-100 truncate" x-text="'@' + notFoundName"></h4>
                                <span class="px-1.5 py-0.2 rounded text-[10px] font-semibold bg-amber-50 dark:bg-amber-950/60 text-amber-600 dark:text-amber-400 border border-amber-200 dark:border-amber-800">
                                    Not Registered
                                </span>
                            </div>
                            <p class="text-xs text-slate-500 dark:text-zinc-400 mt-1 leading-relaxed">
                                No account found in AetherSpace for <strong class="text-slate-700 dark:text-zinc-200" x-text="'@' + notFoundName"></strong>.
                            </p>
                            <div class="mt-2.5 p-2 rounded-lg bg-slate-50 dark:bg-zinc-900 border border-slate-200/80 dark:border-zinc-800 text-[11px] text-slate-500 dark:text-zinc-400">
                                💡 This person does not have an account in this workspace and cannot be notified.
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>

<script>
function universalUserHoverCard() {
    return {
        open: false,
        loading: false,
        loaded: false,
        notFound: false,
        notFoundName: '',
        expandedWorkspaces: false,
        showTimeout: null,
        hideTimeout: null,
        currentTarget: null,
        cardTop: 0,
        cardLeft: 0,
        data: {},

        getRoleBadge(m) {
            if (!m) return { text: 'Contributor', bg: 'bg-emerald-600 dark:bg-emerald-600 text-white' };
            const role = (m.role || '').toUpperCase();
            if (role === 'ADMIN') {
                return { text: 'ADMIN', bg: 'bg-purple-600 dark:bg-purple-600 text-white' };
            }
            if (role === 'MANAGER') {
                return { text: 'MANAGER', bg: 'bg-blue-600 dark:bg-blue-600 text-white' };
            }
            if (m.functional_role && m.functional_role.trim()) {
                return { text: m.functional_role.trim(), bg: 'bg-blue-600 dark:bg-blue-600 text-white' };
            }
            return { text: 'Contributor', bg: 'bg-emerald-600 dark:bg-emerald-600 text-white' };
        },

        getJobTitle(m) {
            if (!m) return '';
            const role = (m.role || '').toUpperCase();
            if (role === 'ADMIN' || role === 'MANAGER') {
                return m.functional_role || '';
            }
            return '';
        },

        handleMouseOver(e) {
            const trigger = e.target.closest('[data-user-hover], .aether-mention');
            if (!trigger) return;

            // If hovering over the same trigger that's already open, cancel any hide timer
            if (this.currentTarget === trigger && this.open) {
                this.cancelHide();
                return;
            }

            this.currentTarget = trigger;
            clearTimeout(this.hideTimeout);
            clearTimeout(this.showTimeout);

            this.showTimeout = setTimeout(() => {
                this.showFor(trigger);
            }, 150);
        },

        handleMouseOut(e) {
            const trigger = e.target.closest('[data-user-hover], .aether-mention');
            if (!trigger) return;
            clearTimeout(this.showTimeout);
            this.hide();
        },

        handleWindowMouseMove(e) {
            if (!this.open && !this.showTimeout) return;
            const card = this.$refs.popoverCard;
            const isOverTrigger = this.currentTarget && (this.currentTarget === e.target || this.currentTarget.contains(e.target));
            const isOverCard = card && (card === e.target || card.contains(e.target));

            if (!isOverTrigger && !isOverCard) {
                if (this.open && !this.hideTimeout) {
                    this.hide();
                } else if (!this.open && this.showTimeout) {
                    clearTimeout(this.showTimeout);
                    this.showTimeout = null;
                }
            } else {
                this.cancelHide();
            }
        },

        handleClickOutside(e) {
            const card = this.$refs.popoverCard;
            if (this.open && card && !card.contains(e.target) && (!this.currentTarget || !this.currentTarget.contains(e.target))) {
                this.hideImmediate();
            }
        },

        adjustPosition() {
            if (!this.currentTarget) return;
            const rect = this.currentTarget.getBoundingClientRect();
            const cardWidth = 350;
            const rowCount = this.data.memberships && this.data.memberships.length ? (this.expandedWorkspaces ? this.data.memberships.length : Math.min(this.data.memberships.length, 3)) : 1;
            const cardHeight = 220 + (rowCount * 28);

            let top = rect.bottom + 6;
            if (top + cardHeight > window.innerHeight - 10) {
                top = Math.max(10, rect.top - cardHeight - 6);
            }

            let left = rect.left;
            if (left + cardWidth > window.innerWidth - 16) {
                left = window.innerWidth - cardWidth - 16;
            }
            if (left < 16) left = 16;

            this.cardTop = top;
            this.cardLeft = left;
        },

        showFor(trigger) {
            const identifier = trigger.getAttribute('data-user-id') ||
                               trigger.getAttribute('data-contributor-id') ||
                               trigger.getAttribute('data-user-name') ||
                               trigger.textContent.replace('@', '').trim();

            if (!identifier) return;

            const rect = trigger.getBoundingClientRect();
            const cardWidth = 350;
            const cardHeight = 240;

            let top = rect.bottom + 6;
            if (top + cardHeight > window.innerHeight - 10) {
                top = Math.max(10, rect.top - cardHeight - 6);
            }

            let left = rect.left;
            if (left + cardWidth > window.innerWidth - 16) {
                left = window.innerWidth - cardWidth - 16;
            }
            if (left < 16) left = 16;

            this.cardTop = top;
            this.cardLeft = left;
            this.expandedWorkspaces = false;
            let wsSlug = trigger.getAttribute('data-workspace-slug') || '';
            if (!wsSlug) {
                const match = window.location.pathname.match(/\/w\/([^\/]+)/);
                if (match) wsSlug = match[1];
            }
            this.fetchData(identifier, wsSlug);
        },

        async fetchData(identifier, wsSlug) {
            this.loading = true;
            this.loaded = false;
            this.notFound = false;
            try {
                const url = `/auth/api/user-card/${encodeURIComponent(identifier)}/?workspace=${encodeURIComponent(wsSlug)}`;
                const res = await fetch(url);
                if (res.ok) {
                    this.data = await res.json();
                    this.loaded = true;
                    this.notFound = false;
                    this.open = true;
                } else {
                    // Mention target not registered in AetherSpace (e.g. @yash)
                    this.notFound = true;
                    this.notFoundName = identifier;
                    this.loaded = false;
                    this.open = true;
                }
            } catch (err) {
                this.notFound = true;
                this.notFoundName = identifier;
                this.loaded = false;
                this.open = true;
            } finally {
                this.loading = false;
            }
        },

        hide() {
            clearTimeout(this.showTimeout);
            if (this.hideTimeout) return;
            this.hideTimeout = setTimeout(() => {
                this.open = false;
                this.currentTarget = null;
                this.hideTimeout = null;
                this.expandedWorkspaces = false;
            }, 150);
        },

        hideImmediate() {
            clearTimeout(this.showTimeout);
            clearTimeout(this.hideTimeout);
            this.hideTimeout = null;
            this.showTimeout = null;
            this.open = false;
            this.currentTarget = null;
            this.expandedWorkspaces = false;
        },

        cancelHide() {
            clearTimeout(this.hideTimeout);
            this.hideTimeout = null;
        }
    };
}
</script>
