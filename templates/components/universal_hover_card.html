<!-- Universal Global People Hover Card for Mentions & User Elements -->
<div x-data="universalUserHoverCard()"
     x-cloak
     @mouseover.window="handleMouseOver($event)"
     @mouseout.window="handleMouseOut($event)"
     @mousemove.window.passive="handleWindowMouseMove($event)"
     @scroll.window.passive="hideImmediate()"
     @click.window="handleClickOutside($event)"
     class="relative z-[9999]">

    <!-- Floating Popover Card -->
    <div x-ref="popoverCard"
         x-show="open"
         x-transition:enter="transition ease-out duration-150"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-100"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95"
         @mouseenter="cancelHide()"
         @mouseleave="hide()"
         :style="`position: fixed; top: ${cardTop}px; left: ${cardLeft}px; z-index: 99999;`"
         class="w-72 rounded-2xl bg-white dark:bg-[#18181b] border border-slate-200 dark:border-zinc-800 shadow-2xl p-4 pointer-events-auto select-none"
         style="display: none;">

        <!-- Loading State Spinner -->
        <template x-if="loading && !loaded">
            <div class="flex items-center justify-center py-6 space-x-2 text-slate-400">
                <svg class="animate-spin h-5 w-5 text-blue-600" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                </svg>
                <span class="text-xs font-medium">Loading profile...</span>
            </div>
        </template>

        <!-- Profile Content -->
        <template x-if="loaded">
            <div>
                <!-- Top Identity Row: Avatar + Name + ID -->
                <div class="flex items-start gap-3">
                    <div class="relative w-12 h-12 rounded-full ring-2 ring-blue-500/30 bg-slate-100 dark:bg-zinc-800 flex items-center justify-center shrink-0">
                        <template x-if="data.avatar && !data.avatar.startsWith('preset:')">
                            <img :src="data.avatar" alt="" class="w-full h-full object-cover rounded-full">
                        </template>
                        <template x-if="!data.avatar || data.avatar.startsWith('preset:')">
                            <div class="w-full h-full rounded-full bg-gradient-to-tr from-blue-600 to-indigo-700 text-white font-bold text-sm flex items-center justify-center">
                                <span x-text="data.initials"></span>
                            </div>
                        </template>
                        <!-- Availability status indicator dot -->
                        <span class="absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full border-2 border-white dark:border-[#18181b]"
                              :class="{
                                  'bg-emerald-500': data.availability_status === 'available',
                                  'bg-rose-500': data.availability_status === 'busy',
                                  'bg-red-600': data.availability_status === 'dnd',
                                  'bg-amber-500': data.availability_status === 'away',
                                  'bg-slate-400': data.availability_status === 'ooo' || !data.availability_status
                              }"
                              :title="data.availability_status ? data.availability_status.toUpperCase() : 'Available'">
                        </span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-1.5">
                            <h4 class="text-sm font-bold text-slate-900 dark:text-zinc-50 truncate" x-text="data.full_name"></h4>
                        </div>
                        <p class="text-xs text-slate-500 dark:text-zinc-400 truncate" x-text="data.email"></p>
                        <template x-if="data.contributor_id">
                            <span class="inline-flex items-center gap-1 mt-1 px-1.5 py-0.5 rounded text-[10px] font-mono font-semibold bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20">
                                <svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2" /></svg>
                                <span x-text="data.contributor_id"></span>
                            </span>
                        </template>
                    </div>
                </div>

                <!-- Custom Status Message snippet if set -->
                <template x-if="data.status_message">
                    <div class="mt-2 px-2.5 py-1 rounded-lg bg-slate-50 dark:bg-zinc-800/80 border border-slate-200/60 dark:border-zinc-700/60 flex items-center gap-1.5 text-xs text-slate-700 dark:text-zinc-200">
                        <span class="text-sm">💬</span>
                        <span class="truncate italic" x-text="data.status_message"></span>
                    </div>
                </template>

                <!-- Headline / Bio snippet if available -->
                <template x-if="data.headline">
                    <p class="mt-2 text-xs text-slate-600 dark:text-zinc-300 line-clamp-2 italic" x-text="data.headline"></p>
                </template>

                <!-- Primary Responsibility & Scope Ribbon -->
                <div class="mt-2.5 p-2.5 rounded-xl bg-slate-50 dark:bg-zinc-900/90 border border-slate-200/80 dark:border-zinc-800/80 shadow-2xs space-y-1">
                    <div class="flex items-center justify-between text-[10px] font-bold uppercase tracking-wider text-slate-400 dark:text-zinc-500">
                        <span class="flex items-center gap-1">
                            <svg class="w-3 h-3 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                            </svg>
                            Role &amp; Responsibility
                        </span>
                        <template x-if="data.workspace_role">
                            <span class="px-1.5 py-0.5 rounded text-[9px] font-bold uppercase tracking-wider"
                                  :class="{
                                      'bg-purple-50 dark:bg-purple-950/70 text-purple-600 dark:text-purple-300 border border-purple-200 dark:border-purple-800/60': data.workspace_role === 'Admin',
                                      'bg-blue-50 dark:bg-blue-950/70 text-blue-600 dark:text-blue-300 border border-blue-200 dark:border-blue-800/60': data.workspace_role === 'Manager',
                                      'bg-slate-100 dark:bg-zinc-800 text-slate-600 dark:text-zinc-400 border border-slate-200 dark:border-zinc-700': data.workspace_role !== 'Admin' && data.workspace_role !== 'Manager'
                                  }"
                                  x-text="data.workspace_role">
                            </span>
                        </template>
                    </div>

                    <!-- Highlight: {designation role • tagging role • workspace name} -->
                    <div class="flex items-center gap-1.5 flex-wrap text-xs pt-0.5">
                        <span class="font-bold text-slate-900 dark:text-zinc-100"
                              x-text="data.designation || data.functional_role || 'Team Member'">
                        </span>

                        <template x-if="data.tagging_role">
                            <span class="text-slate-400 dark:text-zinc-500 font-black text-[10px]">&bull;</span>
                        </template>

                        <template x-if="data.tagging_role">
                            <span class="px-2 py-0.5 rounded-md text-[10px] font-bold tracking-wide bg-purple-50 dark:bg-purple-950/60 text-purple-700 dark:text-purple-300 border border-purple-200 dark:border-purple-800/60"
                                  x-text="data.tagging_role">
                            </span>
                        </template>

                        <template x-if="data.workspace_name">
                            <span class="text-slate-400 dark:text-zinc-500 font-black text-[10px]">&bull;</span>
                        </template>

                        <template x-if="data.workspace_name">
                            <span class="inline-flex items-center gap-1 text-[11px] font-semibold text-slate-600 dark:text-zinc-300 truncate max-w-[150px]"
                                  :title="data.workspace_name">
                                <svg class="w-3 h-3 text-blue-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                                </svg>
                                <span x-text="data.workspace_name"></span>
                            </span>
                        </template>
                    </div>
                </div>

                <!-- Reports To -->
                <template x-if="data.reporting_to_name">
                    <div class="mt-2 px-2.5 py-1.5 rounded-lg bg-slate-100/70 dark:bg-zinc-800/40 border border-slate-200/60 dark:border-zinc-800/80 flex items-center justify-between text-[11px]">
                        <div class="flex items-center gap-1.5 text-slate-500 dark:text-zinc-400 truncate">
                            <svg class="w-3.5 h-3.5 text-slate-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                            <span>Reports to:</span>
                            <span class="font-bold text-slate-800 dark:text-zinc-200 truncate" x-text="data.reporting_to_name"></span>
                        </div>
                        <template x-if="data.reporting_to_role">
                            <span class="text-[10px] font-medium text-slate-400 shrink-0 ml-1" x-text="data.reporting_to_role"></span>
                        </template>
                    </div>
                </template>

                <!-- Quick Actions -->
                <div class="mt-3 pt-2.5 border-t border-slate-100 dark:border-zinc-800/80 grid grid-cols-2 gap-2">
                    <template x-if="data.dm_url">
                        <a :href="data.dm_url" class="inline-flex items-center justify-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 hover:bg-blue-700 text-white transition shadow-sm">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
                            Message
                        </a>
                    </template>
                    <template x-if="!data.dm_url">
                        <a :href="data.mailto_url" class="inline-flex items-center justify-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-100 dark:bg-zinc-800 hover:bg-slate-200 dark:hover:bg-zinc-700 text-slate-700 dark:text-zinc-200 border border-slate-200 dark:border-zinc-700 transition">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
                            Email
                        </a>
                    </template>
                    <a :href="data.profile_url" class="inline-flex items-center justify-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-100 dark:bg-zinc-800 hover:bg-slate-200 dark:hover:bg-zinc-700 text-slate-700 dark:text-zinc-200 border border-slate-200 dark:border-zinc-700 transition">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                        Profile
                    </a>
                </div>
            </div>
        </template>

        <!-- Not Found State for Unregistered Persons -->
        <template x-if="notFound && !loading">
            <div class="p-1">
                <div class="flex items-start space-x-3">
                    <div class="w-10 h-10 rounded-full bg-slate-100 dark:bg-zinc-800 text-slate-400 dark:text-zinc-500 flex items-center justify-center shrink-0 border border-slate-200 dark:border-zinc-700">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center space-x-1.5">
                            <h4 class="text-xs font-bold text-slate-900 dark:text-zinc-100 truncate" x-text="'@' + notFoundName"></h4>
                            <span class="px-1.5 py-0.2 rounded text-[10px] font-semibold bg-amber-50 dark:bg-amber-950/60 text-amber-600 dark:text-amber-400 border border-amber-200 dark:border-amber-800">
                                Not Registered
                            </span>
                        </div>
                        <p class="text-xs text-slate-500 dark:text-zinc-400 mt-1 leading-relaxed">
                            No account found in AetherSpace for <strong class="text-slate-700 dark:text-zinc-200" x-text="'@' + notFoundName"></strong>.
                        </p>
                        <div class="mt-2.5 p-2 rounded-lg bg-slate-50 dark:bg-zinc-900 border border-slate-200/80 dark:border-zinc-800 text-[11px] text-slate-500 dark:text-zinc-400">
                            💡 This person does not have an account in this workspace and cannot be notified.
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>
</div>

<script>
function universalUserHoverCard() {
    return {
        open: false,
        loading: false,
        loaded: false,
        notFound: false,
        notFoundName: '',
        showTimeout: null,
        hideTimeout: null,
        currentTarget: null,
        cardTop: 0,
        cardLeft: 0,
        data: {},

        handleMouseOver(e) {
            const trigger = e.target.closest('[data-user-hover], .aether-mention');
            if (!trigger) return;

            // If hovering over the same trigger that's already open, cancel any hide timer
            if (this.currentTarget === trigger && this.open) {
                this.cancelHide();
                return;
            }

            this.currentTarget = trigger;
            clearTimeout(this.hideTimeout);
            clearTimeout(this.showTimeout);

            this.showTimeout = setTimeout(() => {
                this.showFor(trigger);
            }, 150);
        },

        handleMouseOut(e) {
            const trigger = e.target.closest('[data-user-hover], .aether-mention');
            if (!trigger) return;
            clearTimeout(this.showTimeout);
            this.hide();
        },

        handleWindowMouseMove(e) {
            if (!this.open && !this.showTimeout) return;
            const card = this.$refs.popoverCard;
            const isOverTrigger = this.currentTarget && (this.currentTarget === e.target || this.currentTarget.contains(e.target));
            const isOverCard = card && (card === e.target || card.contains(e.target));

            if (!isOverTrigger && !isOverCard) {
                if (this.open && !this.hideTimeout) {
                    this.hide();
                } else if (!this.open && this.showTimeout) {
                    clearTimeout(this.showTimeout);
                    this.showTimeout = null;
                }
            } else {
                this.cancelHide();
            }
        },

        handleClickOutside(e) {
            const card = this.$refs.popoverCard;
            if (this.open && card && !card.contains(e.target) && (!this.currentTarget || !this.currentTarget.contains(e.target))) {
                this.hideImmediate();
            }
        },

        showFor(trigger) {
            const identifier = trigger.getAttribute('data-user-id') ||
                               trigger.getAttribute('data-contributor-id') ||
                               trigger.getAttribute('data-user-name') ||
                               trigger.textContent.replace('@', '').trim();

            if (!identifier) return;

            const rect = trigger.getBoundingClientRect();
            const cardWidth = 288;
            const cardHeight = 220;

            let top = rect.bottom + 6;
            if (top + cardHeight > window.innerHeight - 10) {
                top = Math.max(10, rect.top - cardHeight - 6);
            }

            let left = rect.left;
            if (left + cardWidth > window.innerWidth - 16) {
                left = window.innerWidth - cardWidth - 16;
            }
            if (left < 16) left = 16;

            this.cardTop = top;
            this.cardLeft = left;
            let wsSlug = trigger.getAttribute('data-workspace-slug') || '';
            if (!wsSlug) {
                const match = window.location.pathname.match(/\/w\/([^\/]+)/);
                if (match) wsSlug = match[1];
            }
            this.fetchData(identifier, wsSlug);
        },

        async fetchData(identifier, wsSlug) {
            this.loading = true;
            this.loaded = false;
            this.notFound = false;
            try {
                const url = `/auth/api/user-card/${encodeURIComponent(identifier)}/?workspace=${encodeURIComponent(wsSlug)}`;
                const res = await fetch(url);
                if (res.ok) {
                    this.data = await res.json();
                    this.loaded = true;
                    this.notFound = false;
                    this.open = true;
                } else {
                    // Mention target not registered in AetherSpace (e.g. @yash)
                    this.notFound = true;
                    this.notFoundName = identifier;
                    this.loaded = false;
                    this.open = true;
                }
            } catch (err) {
                this.notFound = true;
                this.notFoundName = identifier;
                this.loaded = false;
                this.open = true;
            } finally {
                this.loading = false;
            }
        },

        hide() {
            clearTimeout(this.showTimeout);
            if (this.hideTimeout) return;
            this.hideTimeout = setTimeout(() => {
                this.open = false;
                this.currentTarget = null;
                this.hideTimeout = null;
            }, 150);
        },

        hideImmediate() {
            clearTimeout(this.showTimeout);
            clearTimeout(this.hideTimeout);
            this.hideTimeout = null;
            this.showTimeout = null;
            this.open = false;
            this.currentTarget = null;
        },

        cancelHide() {
            clearTimeout(this.hideTimeout);
            this.hideTimeout = null;
        }
    };
}
</script>
