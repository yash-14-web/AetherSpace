<!-- Desktop & Mobile Shell Navigation -->
<div class="flex shrink-0">
    <!-- 1. Global Narrow Icon Rail (Obsidian Dark / Slate Light) -->
    <aside class="w-16 bg-white dark:bg-obsidian-950 border-r border-slate-border dark:border-obsidian-border flex flex-col items-center py-4 justify-between z-30 shrink-0">
        <div class="flex flex-col items-center space-y-5">
            <!-- App Logo Icon -->
            <a href="{% url 'core:landing' %}" class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-600 flex items-center justify-center text-white font-black text-sm shadow-md hover:scale-105 transition-transform" title="AetherSpace">
                Æ
            </a>

            <!-- Global Module Icons -->
            <nav class="flex flex-col space-y-2 mt-4">
                <!-- Dashboard -->
                <a href="#" class="p-2.5 rounded-xl text-aether-blue bg-blue-50 dark:bg-blue-950/40 transition-colors" title="Dashboard">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                </a>

                <!-- Tasks -->
                <a href="#" class="p-2.5 rounded-xl text-slate-500 dark:text-zinc-400 hover:text-slate-800 dark:hover:text-zinc-200 hover:bg-slate-100 dark:hover:bg-obsidian-800 transition-colors" title="Tasks">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
                    </svg>
                </a>

                <!-- Bugs -->
                <a href="#" class="p-2.5 rounded-xl text-slate-500 dark:text-zinc-400 hover:text-slate-800 dark:hover:text-zinc-200 hover:bg-slate-100 dark:hover:bg-obsidian-800 transition-colors" title="Bugs">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                    </svg>
                </a>

                <!-- Chat -->
                <a href="#" class="p-2.5 rounded-xl text-slate-500 dark:text-zinc-400 hover:text-slate-800 dark:hover:text-zinc-200 hover:bg-slate-100 dark:hover:bg-obsidian-800 transition-colors" title="Chat">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                    </svg>
                </a>

                <!-- Meet Hub -->
                <a href="#" class="p-2.5 rounded-xl text-slate-500 dark:text-zinc-400 hover:text-slate-800 dark:hover:text-zinc-200 hover:bg-slate-100 dark:hover:bg-obsidian-800 transition-colors" title="Meet Hub">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                    </svg>
                </a>

                <!-- Calendar -->
                <a href="#" class="p-2.5 rounded-xl text-slate-500 dark:text-zinc-400 hover:text-slate-800 dark:hover:text-zinc-200 hover:bg-slate-100 dark:hover:bg-obsidian-800 transition-colors" title="Calendar">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                </a>

                <!-- Files -->
                <a href="#" class="p-2.5 rounded-xl text-slate-500 dark:text-zinc-400 hover:text-slate-800 dark:hover:text-zinc-200 hover:bg-slate-100 dark:hover:bg-obsidian-800 transition-colors" title="Files">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
                    </svg>
                </a>
            </nav>
        </div>

        <!-- Bottom Controls on Rail -->
        <div class="flex flex-col items-center space-y-3">
            <!-- Settings -->
            <a href="#" class="p-2.5 rounded-xl text-slate-500 dark:text-zinc-400 hover:text-slate-800 dark:hover:text-zinc-200 hover:bg-slate-100 dark:hover:bg-obsidian-800 transition-colors" title="Settings">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
            </a>
        </div>
    </aside>

    <!-- 2. Workspace Navigation Tree (Collapsible on mobile) -->
    <div :class="{'block': mobileSidebarOpen, 'hidden lg:block': !mobileSidebarOpen}" 
         class="w-60 bg-slate-50 dark:bg-obsidian-900 border-r border-slate-border dark:border-obsidian-border flex flex-col py-4 px-3 overflow-y-auto shrink-0 z-20">
        <div class="px-2 mb-3">
            <span class="text-[11px] font-semibold text-slate-400 dark:text-zinc-500 uppercase tracking-wider">Workspace</span>
            <div class="flex items-center justify-between mt-1">
                <span class="text-sm font-bold text-slate-800 dark:text-zinc-200">Smart Classroom</span>
                <span class="text-[10px] px-1.5 py-0.5 rounded bg-blue-100 dark:bg-blue-950 text-blue-700 dark:text-blue-300 font-semibold">Pro</span>
            </div>
        </div>

        <!-- Scoped Workspace Menu -->
        <div class="space-y-1 mt-2">
            <a href="#" class="flex items-center px-2.5 py-2 text-xs font-medium rounded-lg bg-white dark:bg-obsidian-800 text-slate-900 dark:text-zinc-100 shadow-sm border border-slate-200 dark:border-zinc-800">
                <span>Overview & Dashboard</span>
            </a>
            <a href="#" class="flex items-center px-2.5 py-2 text-xs font-medium rounded-lg text-slate-600 dark:text-zinc-400 hover:bg-slate-200/60 dark:hover:bg-obsidian-800 transition-colors">
                <span>Team Members</span>
            </a>
            <a href="#" class="flex items-center px-2.5 py-2 text-xs font-medium rounded-lg text-slate-600 dark:text-zinc-400 hover:bg-slate-200/60 dark:hover:bg-obsidian-800 transition-colors">
                <span>Project Details</span>
            </a>
            <a href="#" class="flex items-center px-2.5 py-2 text-xs font-medium rounded-lg text-slate-600 dark:text-zinc-400 hover:bg-slate-200/60 dark:hover:bg-obsidian-800 transition-colors">
                <span>Workspace Chat</span>
            </a>
        </div>
    </div>
</div>
