<!-- Reusable People Search Empty Prompt Component -->
<div class="py-8 px-4 text-center select-none">
    <div class="w-12 h-12 mx-auto mb-3 rounded-2xl bg-blue-50 dark:bg-blue-950/50 border border-blue-100 dark:border-blue-900/60 flex items-center justify-center text-blue-600 dark:text-blue-400 shadow-sm">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
    </div>
    <h4 class="text-xs font-bold text-slate-800 dark:text-zinc-200 mb-1">
        {{ title|default:"Type to search people" }}
    </h4>
    <p class="text-[11px] text-slate-400 dark:text-zinc-500 max-w-xs mx-auto leading-relaxed">
        {{ subtitle|default:"Enter a name, username, or email address above to view matching people." }}
    </p>
</div>
